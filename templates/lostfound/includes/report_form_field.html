<div class="mb-3">
    <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
        {{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
        <div class="form-text" id="{{ field.auto_id }}_help">{{ field.help_text }}</div>
    {% endif %}
    <div class="invalid-feedback{% if field.errors %} d-block{% endif %}" id="{{ field.auto_id }}_errors" aria-live="polite">
        {% for error in field.errors %}<div>{{ error }}</div>{% endfor %}
    </div>
</div>
