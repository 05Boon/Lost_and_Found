{% extends 'lostfound/base.html' %}
{% block title %}Password updated · FindIt{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5">
    <div class="card text-center"><div class="card-body p-5">
        <i class="bi bi-check-circle text-success" style="font-size:2.5rem"></i>
        <h1 class="h3 fw-bold mt-3">Password updated</h1>
        <p class="text-muted">Your password has been changed. Sign in with your new password.</p>
        <a href="{% url 'login' %}" class="btn btn-primary">Sign in</a>
    </div></div>
</div></div>
{% endblock %}
