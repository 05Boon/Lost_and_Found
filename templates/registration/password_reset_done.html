{% extends 'lostfound/base.html' %}
{% block title %}Check your email · FindIt{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5">
    <div class="card text-center"><div class="card-body p-5">
        <i class="bi bi-envelope-check text-success" style="font-size:2.5rem"></i>
        <h1 class="h3 fw-bold mt-3">Check your email</h1>
        <p class="text-muted">If an account uses that address, password-reset instructions have been sent.</p>
        <a href="{% url 'login' %}" class="btn btn-outline-primary">Return to sign in</a>
    </div></div>
</div></div>
{% endblock %}
